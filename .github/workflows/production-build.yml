name: Production Build

on:
  pull_request:
    branches: [master]

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/dev.db
          NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
          AUTH_SECRET: ci-build-secret-min-32-chars-long
          CRON_SECRET: ci-build-cron-secret
          NEXTAUTH_URL: https://www.gulivechat.com
          NEXT_PUBLIC_APP_URL: https://www.gulivechat.com
